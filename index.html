<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel &amp; Route Log</title>
  <link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6b4f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef1ec;--surface:#fff;--ink:#1d2a24;--muted:#5f6d66;--line:#d3dad4;--accent:#0f6b4f;--accent-ink:#fff;--warn:#b45309;--bad:#b42318;--ok:#0f6b4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--surface:#1c2420;--ink:#e6ece8;--muted:#98a69e;--line:#2f3b35;--accent:#4cc39a;--accent-ink:#0b1712;--warn:#f0a95a;--bad:#f2837a;--ok:#4cc39a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a17;--surface:#1c2420;--ink:#e6ece8;--muted:#98a69e;--line:#2f3b35;--accent:#4cc39a;--accent-ink:#0b1712;--warn:#f0a95a;--bad:#f2837a;--ok:#4cc39a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
h1{font:700 28px/1.2 "Bitter",Georgia,serif;margin:4px 0 2px}
h2{font:700 20px/1.2 "Bitter",Georgia,serif;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font:700 22px "Bitter",Georgia,serif}
.stat span{color:var(--muted);font-size:13px}
nav{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 16px inherit;font-family:inherit;color:var(--muted);cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 12px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
input,select{font:16px inherit;font-family:inherit;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wide{grid-column:1/-1}
.actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 15px inherit;font-family:inherit;padding:9px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.del{border-color:var(--bad);color:var(--bad);background:none}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:760px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:14px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.vcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.vc{border:1px solid var(--line);border-radius:8px;padding:12px}
.vc small{color:var(--muted);display:block}
.vc strong{font:700 18px "Bitter",Georgia,serif;display:block;margin:2px 0}
.tag{font-size:13px;font-weight:600}
.ok{color:var(--ok)}.soon{color:var(--warn)}.exp{color:var(--bad)}
[hidden]{display:none!important}
.locked nav,.locked section,.locked .stats{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>Fuel &amp; route log</h1>
<p class="sub" id="vsub">Add your vehicle in the Vehicle tab to get started.</p>
<p class="sub" id="sync"></p>
<button class="btn ghost sm" id="lo" hidden>Sign out</button>
<div class="panel" id="login" hidden><h2>Sign in</h2><form onsubmit="return false"><label>Email<input id="lem" type="email" autocomplete="username"></label><label>Password (6+ characters)<input id="lpw" type="password" autocomplete="current-password"></label><div class="actions"><button class="btn" type="button" id="li">Sign in</button><button class="btn ghost" type="button" id="su">Create account</button></div><p id="lmsg" class="wide" style="color:var(--bad);margin:0"></p></form></div>
<button class="btn ghost sm" id="imp" style="margin-bottom:14px" hidden>Upload data saved on this device</button>
<div class="stats" id="stats"></div>
<nav role="tablist">
<button role="tab" data-t="fuel" aria-selected="true">Fuel refills</button>
<button role="tab" data-t="route" aria-selected="false">Daily routes</button>
<button role="tab" data-t="veh" aria-selected="false">Vehicle</button>
</nav>

<section id="fuel">
<div class="panel"><h2 id="fh">Add a refill</h2>
<form id="ff">
<label>Sl. No / Code<input name="code" required></label>
<label>Refill date<input type="date" name="date" required></label>
<label class="wide">Location (petrol pump)<input name="loc" required></label>
<label>Qty (litres)<input type="number" step="0.01" min="0" name="qty" required></label>
<label>Density<input type="number" step="0.0001" min="0" name="den"></label>
<label>Rate / litre (₹)<input type="number" step="0.01" min="0" name="rate" required></label>
<label>Total amount (₹)<input type="number" step="0.01" min="0" name="total" required></label>
<label>Total run (KM)<input type="number" step="0.1" min="0" name="run"></label>
<label class="wide">Remarks<input name="rem"></label>
<div class="actions"><button class="btn" type="submit">Save refill</button><button class="btn ghost" type="button" id="fc" hidden>Cancel edit</button></div>
</form></div>
<div class="panel"><div class="top"><h2>Refill history</h2><button class="btn ghost sm" data-x="fuel">Export CSV</button></div>
<div class="scroll" id="ft"></div></div>
</section>

<section id="route" hidden>
<div class="panel"><h2 id="rh">Add a route</h2>
<form id="rf">
<label>Fuel refill code<select name="code" id="rcode" required></select></label>
<label>Date<input type="date" name="date" required></label>
<label>From<input name="from" required></label>
<label>To<input name="to" required></label>
<label>Distance (KM)<input type="number" step="0.1" min="0" name="km" required></label>
<div class="actions"><button class="btn" type="submit">Save route</button><button class="btn ghost" type="button" id="rc" hidden>Cancel edit</button></div>
</form></div>
<div class="panel"><div class="top"><h2>Route history</h2><button class="btn ghost sm" data-x="route">Export CSV</button></div>
<div class="scroll" id="rt"></div></div>
</section>

<section id="veh" hidden>
<div class="panel"><h2>Vehicle details</h2>
<form id="vf">
<label>Registration number<input name="reg" required placeholder="KL 10 AB 1234"></label>
<label>Registration valid until<input type="date" name="regEnd"></label>
<label>Road tax valid until<input type="date" name="taxEnd"></label>
<label>PUC valid until<input type="date" name="pucEnd"></label>
<div class="actions"><button class="btn" type="submit">Save vehicle</button></div>
</form>
<div class="vcards" id="vc"></div></div>
</section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
var KEY="fuelRouteLog.v1";
var S={fuel:[],route:[],veh:{}},loc={fuel:[],route:[],veh:{}},mode="local",cloud=null;
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);loc={fuel:p.fuel||[],route:p.route||[],veh:p.veh||{}};S={fuel:loc.fuel.slice(),route:loc.route.slice(),veh:loc.veh};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function fail(e){console.error(e);alert("Couldn’t sync: "+(e&&e.message||"unknown error"))}
function put(k,r){if(!cloud){save();return}var d=k==="veh"?cloud.veh:cloud.col(k).doc(r.id);d.set(r).catch(fail)}
function rem(k,id){if(!cloud){save();return}cloud.col(k).doc(id).delete().catch(fail)}
var FIREBASE_CONFIG={apiKey:"AIzaSyD9nhBISxn0RiQOxjDot0UN1st6S3wUMCY",authDomain:"fuel-track-986e5.firebaseapp.com",projectId:"fuel-track-986e5",appId:"1:620326326872:web:76e5b0ada97ebbb7a6302d"};
var who="",unsub=[];
function initCloud(){
if(!window.firebase||FIREBASE_CONFIG.apiKey==="PASTE_HERE")return;
try{firebase.initializeApp(FIREBASE_CONFIG)}catch(e){console.error(e);return}
var auth=firebase.auth(),fs=firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(function(){});
var msg=function(t){$("#lmsg").textContent=t||""};
function go(fn){var e=$("#lem").value.trim(),p=$("#lpw").value;msg("");fn(e,p).catch(function(x){msg(x.message)})}
$("#li").onclick=function(){go(function(e,p){return auth.signInWithEmailAndPassword(e,p)})};
$("#su").onclick=function(){go(function(e,p){return auth.createUserWithEmailAndPassword(e,p)})};
$("#lo").onclick=function(){auth.signOut()};
$("#imp").onclick=function(){loc.fuel.forEach(function(r){put("fuel",r)});loc.route.forEach(function(r){put("route",r)});if(loc.veh.reg)put("veh",loc.veh);try{localStorage.removeItem(KEY)}catch(e){}loc={fuel:[],route:[],veh:{}};render()};
document.body.classList.add("locked");$("#login").hidden=false;
auth.onAuthStateChanged(function(u){
unsub.forEach(function(f){f()});unsub=[];
if(!u){cloud=null;mode="local";who="";S={fuel:[],route:[],veh:{}};document.body.classList.add("locked");$("#login").hidden=false;$("#lo").hidden=true;render();return}
who=u.email;var base="users/"+u.uid;
cloud={col:function(k){return fs.collection(base+"/"+k)},veh:fs.doc(base+"/vehicle/main")};
mode="cloud";S={fuel:[],route:[],veh:{}};
document.body.classList.remove("locked");$("#login").hidden=true;$("#lo").hidden=false;$("#lpw").value="";render();
unsub.push(cloud.col("fuel").onSnapshot(function(s){S.fuel=s.docs.map(function(d){return d.data()});if(!editing.fuel&&!ff.loc.value)ff.code.value=nextCode();render()},fail));
unsub.push(cloud.col("route").onSnapshot(function(s){S.route=s.docs.map(function(d){return d.data()});render()},fail));
unsub.push(cloud.veh.onSnapshot(function(s){S.veh=s.exists?s.data():{};var v=S.veh;if(!vf.contains(document.activeElement)){vf.reg.value=v.reg||"";vf.regEnd.value=v.regEnd||"";vf.taxEnd.value=v.taxEnd||"";vf.pucEnd.value=v.pucEnd||""}render()},fail));
});
}
var $=function(s){return document.querySelector(s)};
var editing={fuel:null,route:null};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function f2(n){return n.toLocaleString("en-IN",{maximumFractionDigits:2,minimumFractionDigits:2})}
function f1(n){return n.toLocaleString("en-IN",{maximumFractionDigits:1})}
function fd(d){if(!d)return"";var a=d.split("-");return a[2]+"-"+a[1]+"-"+a[0]}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function nextCode(){var m=0;S.fuel.forEach(function(r){var x=/(\d+)\s*$/.exec(r.code);if(x)m=Math.max(m,+x[1])});return "RF-"+String(m+1).padStart(3,"0")}

/* tabs */
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){
document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b)});
["fuel","route","veh"].forEach(function(t){$("#"+t).hidden=t!==b.dataset.t})}});

/* auto total */
var ff=$("#ff");
function autoTotal(){var q=num(ff.qty.value),r=num(ff.rate.value);if(q&&r&&document.activeElement!==ff.total)ff.total.value=(q*r).toFixed(2)}
ff.qty.oninput=ff.rate.oninput=autoTotal;

function resetFuel(){editing.fuel=null;ff.reset();ff.code.value=nextCode();ff.date.value=today();$("#fh").textContent="Add a refill";$("#fc").hidden=true}
ff.onsubmit=function(e){e.preventDefault();
var r={id:editing.fuel||uid(),code:ff.code.value.trim(),date:ff.date.value,loc:ff.loc.value.trim(),qty:num(ff.qty.value),den:ff.den.value,rate:num(ff.rate.value),total:num(ff.total.value),run:ff.run.value,rem:ff.rem.value.trim()};
var i=S.fuel.findIndex(function(x){return x.id===r.id});
if(i>=0)S.fuel[i]=r;else S.fuel.push(r);
put("fuel",r);resetFuel();render()};
$("#fc").onclick=resetFuel;

var rf=$("#rf");
function resetRoute(){editing.route=null;rf.reset();rf.date.value=today();$("#rh").textContent="Add a route";$("#rc").hidden=true;codes()}
rf.onsubmit=function(e){e.preventDefault();
var r={id:editing.route||uid(),code:rf.code.value,date:rf.date.value,from:rf.from.value.trim(),to:rf.to.value.trim(),km:num(rf.km.value)};
var i=S.route.findIndex(function(x){return x.id===r.id});
if(i>=0)S.route[i]=r;else S.route.push(r);
put("route",r);var c=r.code;resetRoute();rf.code.value=c;render()};
$("#rc").onclick=resetRoute;

function codes(){var sel=$("#rcode"),cur=sel.value;
var opts=S.fuel.slice().sort(function(a,b){return a.date<b.date?1:-1}).map(function(f){return '<option value="'+esc(f.code)+'">'+esc(f.code)+" · "+fd(f.date)+'</option>'});
sel.innerHTML=opts.length?opts.join(""):'<option value="">Add a refill first</option>';
if(cur)sel.value=cur}

/* vehicle */
var vf=$("#vf");
vf.onsubmit=function(e){e.preventDefault();S.veh={reg:vf.reg.value.trim(),regEnd:vf.regEnd.value,taxEnd:vf.taxEnd.value,pucEnd:vf.pucEnd.value};put("veh",S.veh);render()};
function status(d){if(!d)return'<span class="tag">Not set</span>';
var t=new Date();t.setHours(0,0,0,0);var days=Math.round((new Date(d+"T00:00:00")-t)/864e5);
if(days<0)return'<span class="tag exp">Expired '+(-days)+' days ago</span>';
if(days<=30)return'<span class="tag soon">Expires in '+days+' days</span>';
return'<span class="tag ok">Valid · '+days+' days left</span>'}

function tbl(cols,rows,kind){
if(!rows.length)return'<p class="empty">Nothing here yet. Use the form above to add your first entry.</p>';
return"<table><thead><tr>"+cols.map(function(c){return'<th class="'+(c.n?"n":"")+'">'+c.h+"</th>"}).join("")+"<th></th></tr></thead><tbody>"+
rows.map(function(r){return"<tr>"+cols.map(function(c){return'<td class="'+(c.n?"n":"")+'">'+c.v(r)+"</td>"}).join("")+
'<td><button class="btn ghost sm" data-e="'+kind+'" data-id="'+r.id+'">Edit</button> <button class="btn del sm" data-d="'+kind+'" data-id="'+r.id+'">Delete</button></td></tr>'}).join("")+"</tbody></table>"}

function routeKm(code){return S.route.filter(function(r){return r.code===code}).reduce(function(a,r){return a+r.km},0)}

function render(){
var fs=S.fuel.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
var rs=S.route.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
$("#ft").innerHTML=tbl([
{h:"Code",v:function(r){return esc(r.code)}},{h:"Location",v:function(r){return esc(r.loc)}},{h:"Date",v:function(r){return fd(r.date)}},
{h:"Qty (L)",n:1,v:function(r){return f2(r.qty)}},{h:"Density",n:1,v:function(r){return esc(r.den)}},{h:"Rate (₹/L)",n:1,v:function(r){return f2(r.rate)}},
{h:"Total (₹)",n:1,v:function(r){return f2(r.total)}},{h:"Total run (KM)",n:1,v:function(r){return esc(r.run)}},
{h:"Route KM",n:1,v:function(r){return f1(routeKm(r.code))}},{h:"KM/L",n:1,v:function(r){var k=routeKm(r.code);return k&&r.qty?f1(k/r.qty):"–"}},
{h:"Remarks",v:function(r){return esc(r.rem)}}],fs,"fuel");
$("#rt").innerHTML=tbl([
{h:"Refill code",v:function(r){return esc(r.code)}},{h:"Date",v:function(r){return fd(r.date)}},{h:"From",v:function(r){return esc(r.from)}},
{h:"To",v:function(r){return esc(r.to)}},{h:"Distance (KM)",n:1,v:function(r){return f1(r.km)}}],rs,"route");
codes();
var L=S.fuel.reduce(function(a,r){return a+r.qty},0),M=S.fuel.reduce(function(a,r){return a+r.total},0),K=S.route.reduce(function(a,r){return a+r.km},0);
var cur=new Date().toISOString().slice(0,7),mt=S.fuel.filter(function(r){return(r.date||"").slice(0,7)===cur}).reduce(function(a,r){return a+r.total},0);
var st=[["Total spent","₹"+f2(M)],["This month","₹"+f2(mt)],["Fuel filled",f1(L)+" L"],["Distance logged",f1(K)+" KM"],["Avg rate",L?"₹"+f2(M/L)+"/L":"–"],["Avg mileage",L&&K?f1(K/L)+" KM/L":"–"]];
$("#stats").innerHTML=st.map(function(s){return'<div class="stat"><b>'+s[0+1]+"</b><span>"+s[0]+"</span></div>"}).join("");
var v=S.veh;$("#vsub").textContent=v.reg?"Vehicle: "+v.reg:"Add your vehicle in the Vehicle tab to get started.";
$("#sync").textContent=mode==="cloud"?""+"Synced online. Signed in as "+who+". Open this page on any device and sign in to see the same data.":"Saved on this device only (online sync is not set up).";
$("#imp").hidden=!(mode==="cloud"&&(loc.fuel.length||loc.route.length||loc.veh.reg));
$("#vc").innerHTML=v.reg?[["Registration",v.reg,""],["Registration valid until",fd(v.regEnd),status(v.regEnd)],["Road tax valid until",fd(v.taxEnd),status(v.taxEnd)],["PUC valid until",fd(v.pucEnd),status(v.pucEnd)]].map(function(c){return'<div class="vc"><small>'+c[0]+"</small><strong>"+esc(c[1]||"–")+"</strong>"+c[2]+"</div>"}).join(""):"";
}

/* edit / delete / export */
document.addEventListener("click",function(e){var t=e.target;
if(t.dataset.e){var k=t.dataset.e,r=S[k].find(function(x){return x.id===t.dataset.id});if(!r)return;editing[k]=r.id;
if(k==="fuel"){ff.code.value=r.code;ff.date.value=r.date;ff.loc.value=r.loc;ff.qty.value=r.qty;ff.den.value=r.den;ff.rate.value=r.rate;ff.total.value=r.total;ff.run.value=r.run;ff.rem.value=r.rem;$("#fh").textContent="Edit refill";$("#fc").hidden=false;ff.scrollIntoView({block:"start"})}
else{rf.code.value=r.code;rf.date.value=r.date;rf.from.value=r.from;rf.to.value=r.to;rf.km.value=r.km;$("#rh").textContent="Edit route";$("#rc").hidden=false;rf.scrollIntoView({block:"start"})}}
if(t.dataset.d){if(!confirm("Delete this entry? This can’t be undone."))return;var kk=t.dataset.d;S[kk]=S[kk].filter(function(x){return x.id!==t.dataset.id});rem(kk,t.dataset.id);render()}
if(t.dataset.x){var k2=t.dataset.x,cols=k2==="fuel"?["code","loc","date","qty","den","rate","total","run","rem"]:["code","date","from","to","km"];
var csv=[cols.join(",")].concat(S[k2].map(function(r){return cols.map(function(c){return'"'+String(r[c]==null?"":r[c]).replace(/"/g,'""')+'"'}).join(",")})).join("\n");
var a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download=k2+"-log.csv";document.body.appendChild(a);a.click();a.remove()}});

var v=S.veh;if(v.reg){vf.reg.value=v.reg;vf.regEnd.value=v.regEnd||"";vf.taxEnd.value=v.taxEnd||"";vf.pucEnd.value=v.pucEnd||""}
resetFuel();resetRoute();render();initCloud();
})();
</script>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (e) { console.error(e); });
  });
}
</script>
</body>
</html>
